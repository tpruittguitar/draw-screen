<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lottery Picker"><title>Lottery Picker</title><style>:root{--bg:#0b0d12;--card:#141820;--card-2:#1b212c;--line:rgba(255,255,255,.08);--text:#f4f6f8;--muted:#9aa3b2;--red:#d3121a;--gold:#e2b657;--blue:#8eb6ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b0d12;color:var(--text);padding:calc(18px + env(safe-area-inset-top)) 16px 28px}.brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{font-size:32px;margin:6px 0 8px}.lede,.meta,.cash{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px}button{border:0;border-radius:14px;padding:13px;font-weight:650;color:#fff;background:#2a3344}button.primary{background:var(--red);flex:1.4}button.ghost{flex:1}.status{font-size:12px;color:#8fd0a8}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0}.jack{font-size:36px;font-weight:720}.rank{background:var(--card-2);border-radius:16px;padding:12px;margin-top:10px}.balls{display:flex;gap:7px}.ball{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f7f8fa;color:#111;font-weight:720}.ball.pb{background:var(--red);color:#fff}.ball.mb{background:var(--gold)}.sched{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}a{color:var(--blue);display:block;padding:10px 0;text-decoration:none}</style></head><body><div class="brand">Lottery Picker</div><h1>Lottery Picker</h1><p class="lede">Numbers and jackpots refresh on open.</p><div class="actions"><button class="primary" id="refresh">Refresh</button></div><p class="status" id="status">Opening...</p><section class="card" id="pb-card"></section><section class="card" id="mm-card"></section><section class="card"><div id="schedule"></div></section><section class="card"><a href="https://www.powerball.com/watch-drawing">Powerball live draw</a><a href="https://www.megamillions.com/">Mega Millions official</a></section><script>const SNAP={powerball:{name:'Powerball',jackpot:467000000,cash:192400000,next:'Next draw',where:'Tallahassee',odds:'1 in 292,201,338',sets:[{whites:[9,35,42,43,48],bonus:14,sum:177,odd:3,score:-0.1273},{whites:[4,15,35,57,66],bonus:14,sum:177,odd:3,score:-0.1278},{whites:[7,32,42,43,53],bonus:14,sum:177,odd:3,score:-0.1291}]},mega:{name:'Mega Millions',jackpot:345000000,cash:139600000,next:'Next draw',where:'Atlanta',odds:'1 in 290,472,336',sets:[{whites:[14,29,33,36,62],bonus:24,sum:174,odd:2,score:-0.1395},{whites:[13,27,36,48,50],bonus:24,sum:174,odd:2,score:-0.1402},{whites:[7,8,36,61,62],bonus:24,sum:174,odd:2,score:-0.1407}]}};const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});function balls(s,k){return '<div class="balls">'+s.whites.map(n=>'<span class="ball">'+n+'</span>').join('')+'<span class="ball '+k+'">'+s.bonus+'</span></div>';}function card(g,k){return '<div class="meta">'+g.name+'</div><div class="jack">'+money(g.jackpot)+'</div><div class="cash">Annuity. Cash '+money(g.cash)+'.</div><div class="meta">'+g.where+' \u00b7 '+g.next+' \u00b7 '+g.odds+'</div>'+g.sets.map((s,i)=>'<div class="rank"><div class="meta">Rank '+(i+1)+' \u00b7 sum '+s.sum+'</div>'+balls(s,k)+'</div>').join('');}function render(){document.getElementById('pb-card').innerHTML=card(SNAP.powerball,'pb');document.getElementById('mm-card').innerHTML=card(SNAP.mega,'mb');const rules=[{name:'Powerball',days:[1,3,6]},{name:'Mega Millions',days:[2,5]}];const out=[];const start=new Date();for(let i=0;i<21&&out.length<6;i++){const d=new Date(start);d.setDate(start.getDate()+i);for(const rule of rules)if(rule.days.includes(d.getDay()))out.push('<div class="sched"><span>'+rule.name+'</span><span>'+d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</span></div>');}document.getElementById('schedule').innerHTML=out.join('');}function scoreGame(rows,pool){const whites=rows.map(r=>r.whites);const n=whites.length;const freq=Array(pool+1).fill(0);whites.forEach(row=>row.forEach(b=>freq[b]++));const expected=n*5/pool;const z=freq.slice(1).map(c=>(c-expected)/Math.sqrt(expected));const sums=whites.map(r=>r.reduce((a,b)=>a+b,0));const mean=sums.reduce((a,b)=>a+b,0)/n;const std=Math.sqrt(sums.reduce((a,b)=>a+(b-mean)**2,0)/n)||1;const oddMean=whites.reduce((a,r)=>a+r.filter(x=>x%2).length,0)/n;const bonusCount={};rows.forEach(r=>bonusCount[r.bonus]=(bonusCount[r.bonus]||0)+1);const bonus=Number(Object.entries(bonusCount).sort((a,b)=>b[1]-a[1])[0][0]);const seen=new Set();const scored=[];while(scored.length<8000){const pick=[];while(pick.length<5){const v=1+Math.floor(Math.random()*pool);if(!pick.includes(v))pick.push(v);}pick.sort((a,b)=>a-b);const key=pick.join(',');if(seen.has(key))continue;seen.add(key);const sum=pick.reduce((a,b)=>a+b,0);const odd=pick.filter(x=>x%2).length;const fair=pick.reduce((a,b)=>a+Math.abs(z[b-1]),0)/5;scored.push({whites:pick,bonus,sum,odd,score:Math.round((-Math.abs(sum-mean)/std-0.25*Math.abs(odd-oddMean)-0.05*fair)*10000)/10000});}scored.sort((a,b)=>b.score-a.score);return {sets:scored.slice(0,3)};}async function readJackpot(path){const url='https://api.allorigins.win/raw?url='+encodeURIComponent('https://nylottery.ny.gov/nyl-api/games/'+path+'/draws');const data=await (await fetch(url)).json();const row=(data.data.draws||[]).find(d=>d.estimatedJackpot);if(!row)throw new Error('no jackpot');return {jackpot:row.estimatedJackpot,cash:row.jackpots&&row.jackpots[0]?row.jackpots[0].cashAmount:0,next:new Date(row.resultDate).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};}async function refresh(){const status=document.getElementById('status');status.textContent='Updating numbers and jackpots...';let notes=[];try{const pbRaw=await (await fetch('https://data.ny.gov/resource/d6yy-54nr.json?$limit=900')).json();const mmRaw=await (await fetch('https://data.ny.gov/resource/5xaw-6ayf.json?$limit=700')).json();const pb=pbRaw.map(r=>{const p=r.winning_numbers.split(' ').map(Number);return {whites:p.slice(0,5).sort((a,b)=>a-b),bonus:p[5]};}).filter(r=>r.whites.length===5);const mm=mmRaw.map(r=>({whites:r.winning_numbers.split(' ').map(Number).sort((a,b)=>a-b),bonus:Number(r.mega_ball)})).filter(r=>r.whites.length===5);SNAP.powerball.sets=scoreGame(pb,69).sets;SNAP.mega.sets=scoreGame(mm,70).sets;notes.push('numbers updated');}catch(e){notes.push('numbers kept');}try{const pb=await readJackpot('powerball');SNAP.powerball.jackpot=pb.jackpot;SNAP.powerball.cash=pb.cash;SNAP.powerball.next=pb.next;const mm=await readJackpot('megamillions');SNAP.mega.jackpot=mm.jackpot;SNAP.mega.cash=mm.cash;SNAP.mega.next=mm.next;notes.push('jackpots updated');}catch(e){notes.push('jackpots kept');}render();status.textContent=notes.join(', ')+' '+new Date().toLocaleTimeString();}document.getElementById('refresh').onclick=refresh;render();refresh();</script></body></html>
